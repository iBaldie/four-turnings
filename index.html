<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Four Turnings</title>
<style>
  :root {
    --bg: #050505;
    --ink: #ffffff;
    --ink-muted: rgba(255,255,255,0.55);
    --ink-faint: rgba(255,255,255,0.28);
    --line: rgba(255,255,255,0.12);
    --line-strong: rgba(255,255,255,0.28);
    --high: #6b8cae;
    --awakening: #c4a35a;
    --unraveling: #a67c7c;
    --crisis: #c45c4a;
    --hero: #7eb8d4;
    --prophet: #d4b87e;
    --nomad: #b89e7e;
    --artist: #9eb89e;
    --event: rgba(255,255,255,0.7);
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header {
    flex: 0 0 auto;
    padding: 1.25rem 2.5rem 0.5rem;
    opacity: 0;
    animation: fadeIn 0.7s var(--ease) 0.05s forwards;
    z-index: 20;
  }
  .brand h1 {
    font-size: clamp(1.05rem, 2vw, 1.4rem);
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .chain {
    flex: 0 0 auto;
    padding: 0 2.5rem 0.4rem;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    opacity: 0;
    animation: fadeIn 0.7s var(--ease) 0.25s forwards;
    line-height: 1.55;
  }
  .chain strong { color: var(--ink-muted); font-weight: 500; }

  .desktop-stage {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .mobile-stage { display: none; }

  .edge-fade {
    position: absolute; top: 0; bottom: 0; width: 3.5rem;
    pointer-events: none; z-index: 10;
  }
  .edge-fade.left { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
  .edge-fade.right { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }

  .scroll-hint {
    position: absolute; bottom: 1.5rem; right: 2rem;
    font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-faint); z-index: 12; opacity: 0;
    animation: fadeIn 0.7s var(--ease) 2.2s forwards;
    pointer-events: none; transition: opacity 0.35s;
  }
  .scroll-hint.hidden { opacity: 0 !important; }

  .timeline-scroll {
    flex: 1 1 auto;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
    padding: 0 2rem;
  }
  .timeline-scroll::-webkit-scrollbar { height: 4px; }
  .timeline-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  .timeline {
    position: relative;
    height: 100%;
    min-height: 480px;
    /* ~680 years × ~9px */
    width: 6200px;
    padding: 1.25rem 0 4.5rem;
  }

  .saecula-band {
    position: absolute; left: 0; right: 0; top: 0; height: 1.6rem;
  }
  .saeculum {
    position: absolute; top: 0; bottom: 0;
    border-left: 1px solid var(--line);
    padding: 0.15rem 0.5rem 0;
    opacity: 0;
    animation: fadeSlideUp 0.55s var(--ease) forwards;
  }
  .saeculum .sname {
    font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .saeculum .syears {
    font-size: 0.5rem; letter-spacing: 0.06em; color: var(--ink-faint);
  }

  .turnings {
    position: absolute; left: 0; right: 0; top: 1.85rem; height: 4.4rem;
  }
  .turning {
    position: absolute; top: 0; bottom: 0; opacity: 0;
    transform: translateY(8px);
  }
  .turning.enter { animation: fadeSlideUp 0.55s var(--ease) forwards; }
  .turning .band {
    position: absolute; inset: 0;
    border-top: 1px solid currentColor; opacity: 0.7;
  }
  .turning .band::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, currentColor, transparent);
    opacity: 0.14;
  }
  .turning.high { color: var(--high); }
  .turning.awakening { color: var(--awakening); }
  .turning.unraveling { color: var(--unraveling); }
  .turning.crisis { color: var(--crisis); }
  .turning.projected .band { border-top-style: dashed; opacity: 0.4; }
  .turning .label {
    position: absolute; left: 0.4rem; top: 0.35rem;
    max-width: calc(100% - 0.5rem);
  }
  .turning .label .name {
    font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 500; color: currentColor;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .turning .label .dates {
    font-size: 0.5rem; letter-spacing: 0.05em; color: var(--ink-faint);
  }

  .events {
    position: absolute; left: 0; right: 0; top: 6.5rem; height: 5.2rem;
  }
  .event {
    position: absolute; transform: translateX(-50%);
    text-align: center; cursor: default; opacity: 0;
  }
  .event.enter { animation: fadeSlideUpCentered 0.45s var(--ease) forwards; }
  .event .etick {
    width: 1px; height: 12px; margin: 0 auto;
    background: var(--ink-faint);
  }
  .event .elabel {
    margin-top: 0.2rem;
    font-size: 0.5rem; letter-spacing: 0.04em;
    color: var(--event); line-height: 1.25;
    white-space: nowrap; max-width: 5.5rem;
    overflow: hidden; text-overflow: ellipsis;
  }
  .event .eyear {
    font-size: 0.45rem; letter-spacing: 0.06em; color: var(--ink-faint);
  }
  .event.lane-0 { top: 0; }
  .event.lane-1 { top: 1.7rem; }
  .event.lane-2 { top: 3.4rem; }

  .axis {
    position: absolute; left: 0; right: 0; top: 12.2rem;
    height: 1px; background: var(--line-strong);
    transform-origin: left center; transform: scaleX(0);
    animation: drawAxis 1.3s var(--ease) 0.25s forwards;
  }
  @keyframes drawAxis { to { transform: scaleX(1); } }

  .ticks {
    position: absolute; left: 0; right: 0; top: 12.2rem; height: 0;
    pointer-events: none;
  }
  .tick {
    position: absolute; top: 0; transform: translateX(-50%); opacity: 0;
  }
  .tick.visible { animation: fadeUp 0.4s var(--ease) forwards; }
  .tick .stem { width: 1px; height: 8px; background: var(--line-strong); margin: 0 auto; }
  .tick .yr {
    margin-top: 0.3rem; font-size: 0.52rem; letter-spacing: 0.1em;
    color: var(--ink-faint); text-align: center; white-space: nowrap;
  }

  /* Life-stage rows — generational diagonal */
  .stages {
    position: absolute; left: 0; right: 0; top: 13.4rem; height: 7.6rem;
  }
  .stage-row {
    position: absolute; left: 0; right: 0; height: 1.7rem;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .stage-row[data-stage="elder"] { top: 0; }
  .stage-row[data-stage="midlife"] { top: 1.9rem; }
  .stage-row[data-stage="young"] { top: 3.8rem; }
  .stage-row[data-stage="child"] { top: 5.7rem; }
  .stage-label {
    position: sticky; left: 0; z-index: 2;
    display: inline-block; padding: 0.15rem 0.4rem;
    font-size: 0.45rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint); background: rgba(5,5,5,0.85);
  }
  .gen-chip {
    position: absolute; top: 0.25rem; height: 1.2rem;
    transform: translateX(-50%);
    padding: 0 0.35rem;
    border: 1px solid currentColor;
    border-radius: 1px;
    font-size: 0.48rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: inherit; background: rgba(0,0,0,0.35);
    white-space: nowrap; cursor: default; opacity: 0;
    display: flex; align-items: center; gap: 0.3rem;
  }
  .gen-chip.enter { animation: fadeSlideUpCentered 0.45s var(--ease) forwards; }
  .gen-chip .garch { opacity: 0.7; font-size: 0.42rem; letter-spacing: 0.08em; }
  .gen-chip.hero { color: var(--hero); }
  .gen-chip.prophet { color: var(--prophet); }
  .gen-chip.nomad { color: var(--nomad); }
  .gen-chip.artist { color: var(--artist); }
  .gen-chip.projected { border-style: dashed; opacity: 0.85; }

  .gens-birth {
    position: absolute; left: 0; right: 0; top: 21.4rem; height: 2.4rem;
  }
  .gbirth {
    position: absolute; top: 0; height: 1.5rem;
    border-left: 2px solid currentColor;
    padding-left: 0.35rem;
    opacity: 0; cursor: default;
  }
  .gbirth.enter { animation: fadeSlideUp 0.45s var(--ease) forwards; }
  .gbirth.hero { color: var(--hero); }
  .gbirth.prophet { color: var(--prophet); }
  .gbirth.nomad { color: var(--nomad); }
  .gbirth.artist { color: var(--artist); }
  .gbirth.projected { border-left-style: dashed; }
  .gbirth .gn {
    font-size: 0.52rem; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 500; white-space: nowrap;
  }
  .gbirth .gy {
    font-size: 0.45rem; letter-spacing: 0.04em; color: var(--ink-faint);
    white-space: nowrap;
  }

  .tooltip {
    position: fixed; z-index: 100; max-width: min(300px, calc(100vw - 2rem));
    padding: 0.75rem 0.9rem; background: #111; border: 1px solid var(--line-strong);
    font-size: 0.72rem; line-height: 1.5; letter-spacing: 0.02em;
    pointer-events: none; opacity: 0; transform: translateY(5px);
    transition: opacity 0.15s, transform 0.15s;
  }
  .tooltip.show { opacity: 1; transform: translateY(0); }
  .tooltip .tt-title {
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: 0.35rem;
  }
  .tooltip .tt-body { color: var(--ink-muted); }


  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(5px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUpCentered {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }


  .now-marker {
    position: absolute; top: 1.85rem; bottom: 3.2rem;
    width: 2px; transform: translateX(-50%);
    background: rgba(255,255,255,0.75);
    z-index: 9; pointer-events: none;
  }
  .now-marker .now-glow {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 10px; height: 10px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 0 rgba(255,255,255,0.45);
  }
  .now-marker .now-label {
    position: absolute; left: 50%; top: -1.15rem; transform: translateX(-50%);
    font-size: 0.48rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.85); white-space: nowrap;
  }
  .now-marker.pulse .now-glow {
    animation: nowPulse 2.4s ease-in-out infinite;
  }
  @keyframes nowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); opacity: 0.85; }
    50% { box-shadow: 0 0 14px 4px rgba(255,255,255,0.35); opacity: 1; }
  }
  .timeline.zooming {
    will-change: transform;
  }
  @media (prefers-reduced-motion: reduce) {
    .now-marker.pulse .now-glow { animation: none; }
    header, .chain, .scroll-hint, .saeculum, .turning, .event, .tick, .gen-chip, .gbirth, .axis {
      animation: none !important; opacity: 1 !important; transform: none !important;
    }
    .turning, .event, .tick, .gen-chip, .gbirth { opacity: 1; }
  }

  /* Mobile */
  @media (max-width: 700px) {
    html, body { height: 100%; overflow: hidden; }
    body { overflow: hidden; }

    header {
      padding: 0.7rem 1rem 0.25rem;
      flex: 0 0 auto;
      animation: none;
      opacity: 1;
    }
    .brand h1 { font-size: 0.95rem; letter-spacing: 0.16em; }
    .chain {
      display: none;
    }

    .desktop-stage { display: none !important; }

    .mobile-stage {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      padding: 0;
    }

    .tape-readout {
      flex: 0 0 auto;
      margin: 0 0.85rem 0.5rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line-strong);
      background: rgba(10,10,10,0.92);
      z-index: 5;
      max-height: 42vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tape-readout .ro-year {
      font-size: 1.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.1;
      margin-bottom: 0.45rem;
      font-variant-numeric: tabular-nums;
    }
    .tape-readout .ro-row {
      margin-top: 0.35rem;
      font-size: 0.68rem;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    .tape-readout .ro-kicker {
      font-size: 0.5rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.1rem;
    }
    .tape-readout .ro-main { color: var(--ink); }
    .tape-readout .ro-sub { color: var(--ink-muted); }
    .tape-readout .ro-turning.high .ro-main { color: var(--high); }
    .tape-readout .ro-turning.awakening .ro-main { color: var(--awakening); }
    .tape-readout .ro-turning.unraveling .ro-main { color: var(--unraveling); }
    .tape-readout .ro-turning.crisis .ro-main { color: var(--crisis); }
    .tape-readout .ro-gen.hero { color: var(--hero); }
    .tape-readout .ro-gen.prophet { color: var(--prophet); }
    .tape-readout .ro-gen.nomad { color: var(--nomad); }
    .tape-readout .ro-gen.artist { color: var(--artist); }
    .tape-readout .ro-living {
      display: flex; flex-direction: column; gap: 0.2rem;
      margin-top: 0.15rem;
    }
    .tape-readout .ro-living-item {
      display: flex; justify-content: space-between; gap: 0.5rem;
      font-size: 0.62rem; line-height: 1.35;
    }
    .tape-readout .ro-living-item .name { letter-spacing: 0.04em; }
    .tape-readout .ro-living-item .meta { color: var(--ink-muted); text-align: right; }
    .tape-readout .ro-event { color: var(--event); }
    .tape-readout .ro-empty { color: var(--ink-faint); font-size: 0.62rem; }

    .tape-viewport {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .tape-cursor {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 0;
      z-index: 4;
      pointer-events: none;
    }
    .tape-cursor::before {
      content: "";
      position: absolute;
      left: 0; right: 0;
      top: -0.5px;
      height: 1px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 0 12px rgba(255,255,255,0.25);
    }
    .tape-cursor .cursor-year {
      position: absolute;
      left: 0.75rem;
      top: -1.35rem;
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      text-shadow: 0 0 18px rgba(0,0,0,0.9);
    }

    .tape-cursor.pulse .cursor-notch {
      animation: nowPulse 2.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .tape-cursor.pulse .cursor-notch { animation: none; }
    }
    .tape-cursor .cursor-notch {
      position: absolute;
      right: 0.65rem;
      top: -5px;
      width: 10px; height: 10px;
      border: 1px solid var(--ink);
      transform: rotate(45deg);
      background: var(--bg);
    }

    .tape-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .tape-scroll::-webkit-scrollbar { display: none; }

    .tape {
      position: relative;
      width: 100%;
      /* height set in JS: pad + years * pxPerYear + pad */
    }
    .tape-pad {
      height: 50%; /* set precisely in JS to half viewport */
    }
    .tape-bands {
      position: absolute;
      left: 1.1rem;
      width: 1.35rem;
      top: 0; bottom: 0;
      pointer-events: none;
    }
    .tape-band {
      position: absolute;
      left: 0; right: 0;
      opacity: 0.35;
    }
    .tape-band.high { background: var(--high); }
    .tape-band.awakening { background: var(--awakening); }
    .tape-band.unraveling { background: var(--unraveling); }
    .tape-band.crisis { background: var(--crisis); }
    .tape-band.projected { opacity: 0.18; }

    .tape-rail {
      position: absolute;
      left: 1.7rem;
      width: 1px;
      top: 0; bottom: 0;
      background: var(--line-strong);
      pointer-events: none;
    }

    .tape-ticks {
      position: relative;
      margin-left: 1.1rem;
    }
    .tape-tick {
      position: absolute;
      left: 0;
      height: 0;
      width: 100%;
      scroll-snap-align: center;
    }
    .tape-tick .mark {
      position: absolute;
      left: 0.6rem;
      top: 0;
      height: 1px;
      width: 8px;
      background: rgba(255,255,255,0.22);
      transform: translateY(-0.5px);
    }
    .tape-tick.y5 .mark {
      width: 14px;
      background: rgba(255,255,255,0.4);
    }
    .tape-tick.y10 .mark {
      width: 22px;
      background: rgba(255,255,255,0.7);
    }
    .tape-tick.y10 .ylab {
      position: absolute;
      left: 2.15rem;
      top: 0;
      transform: translateY(-50%);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }
    .tape-tick.has-event .mark {
      background: #fff;
      box-shadow: 0 0 6px rgba(255,255,255,0.35);
    }
    .tape-tick .evdot {
      position: absolute;
      left: 0.35rem;
      top: -2px;
      width: 5px; height: 5px;
      background: var(--ink);
      border-radius: 50%;
    }

    .tooltip { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .tape-scroll { scroll-snap-type: y proximity; scroll-behavior: auto; }
    }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Four Turnings</h1>
  </div>
</header>
<div class="chain">
  Parent–child chain: <strong>Heroes</strong> raise Prophets · <strong>Prophets</strong> raise Nomads · <strong>Nomads</strong> raise Artists · <strong>Artists</strong> raise the next Heroes
</div>

<div class="desktop-stage" id="desktopStage">
  <div class="edge-fade left" aria-hidden="true"></div>
  <div class="edge-fade right" aria-hidden="true"></div>
  <div class="scroll-hint" id="scrollHint">›› Scroll · span 1435–2110s</div>
  <div class="timeline-scroll" id="scroller" tabindex="0" aria-label="Historical timeline">
    <div class="timeline" id="timeline">
      <div class="saecula-band" id="saecula"></div>
      <div class="turnings" id="turnings"></div>
      <div class="events" id="events"></div>
      <div class="axis"></div>
      <div class="ticks" id="ticks"></div>
      <div class="stages" id="stages">
        <div class="stage-row" data-stage="elder"><span class="stage-label">Elder</span></div>
        <div class="stage-row" data-stage="midlife"><span class="stage-label">Midlife</span></div>
        <div class="stage-row" data-stage="young"><span class="stage-label">Young adult</span></div>
        <div class="stage-row" data-stage="child"><span class="stage-label">Childhood</span></div>
      </div>
      <div class="gens-birth" id="gensBirth"></div>
    </div>
  </div>
</div>

<div class="mobile-stage" id="mobileStage" aria-label="Year tape timeline">
  <div class="tape-readout" id="tapeReadout" aria-live="polite">
    <div class="ro-year" id="roYear">—</div>
    <div class="ro-row ro-saec">
      <div class="ro-kicker">Saeculum</div>
      <div class="ro-main" id="roSaec">—</div>
    </div>
    <div class="ro-row ro-turning" id="roTurningWrap">
      <div class="ro-kicker">Turning</div>
      <div class="ro-main" id="roTurning">—</div>
      <div class="ro-sub" id="roTurningYears"></div>
    </div>
    <div class="ro-row">
      <div class="ro-kicker">Being born</div>
      <div class="ro-main ro-gen" id="roBorn">—</div>
    </div>
    <div class="ro-row">
      <div class="ro-kicker">Living generations</div>
      <div class="ro-living" id="roLiving"></div>
    </div>
    <div class="ro-row">
      <div class="ro-kicker">Nearby events</div>
      <div class="ro-main ro-event" id="roEvents">—</div>
    </div>
  </div>
  <div class="tape-viewport" id="tapeViewport">
    <div class="tape-cursor" aria-hidden="true">
      <div class="cursor-year" id="cursorYear">—</div>

    tooltip.innerHTML = '<div class="tt-title">' + esc(title) + '</div><div class="tt-body">' + esc(body) + "</div>";
    tooltip.classList.add("show");
    moveTip(e);
  }
  function moveTip(e) {
    var pad = 12, tw = tooltip.offsetWidth || 220, th = tooltip.offsetHeight || 80;
    var x = e.clientX + pad, y = e.clientY + pad;
    if (x + tw > window.innerWidth - 8) x = e.clientX - tw - pad;
    if (y + th > window.innerHeight - 8) y = e.clientY - th - pad;
    tooltip.style.left = Math.max(8, x) + "px";
    tooltip.style.top = Math.max(8, y) + "px";
  }
  function hideTip() { tooltip.classList.remove("show"); }

  document.getElementById("timeline").addEventListener("pointerover", function (e) {
    if (window.matchMedia("(max-width: 700px)").matches) return;
    var t = e.target.closest("[data-tip-title]");
    if (!t) return;
    showTip(e, t.dataset.tipTitle, t.dataset.tipBody);
  });
  document.getElementById("timeline").addEventListener("pointermove", function (e) {
    if (tooltip.classList.contains("show")) moveTip(e);
  });
  document.getElementById("timeline").addEventListener("pointerout", function (e) {
    var t = e.target.closest("[data-tip-title]");
    if (!t) return;
    if (!e.relatedTarget || !t.contains(e.relatedTarget)) hideTip();
  });

  scroller.addEventListener("wheel", function (e) {
    var dx = e.deltaX, dy = e.deltaY;
    if (e.shiftKey && Math.abs(dy) > Math.abs(dx)) { dx = dy; dy = 0; }
    if (Math.abs(dy) > Math.abs(dx) && !e.shiftKey) {
      scroller.scrollLeft += dy; e.preventDefault();
    }
    if (scroller.scrollLeft > 40) scrollHint.classList.add("hidden");
  }, { passive: false });
  scroller.addEventListener("scroll", function () {
    if (scroller.scrollLeft > 40) scrollHint.classList.add("hidden");
  }, { passive: true });
  scroller.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { scroller.scrollLeft += 140; e.preventDefault(); }
    if (e.key === "ArrowLeft") { scroller.scrollLeft -= 140; e.preventDefault(); }
  });
  function desktopScrollTarget() {
    var tw = timelineEl.offsetWidth || 6200;
    var target = (pct(nowYear) / 100) * tw - scroller.clientWidth * 0.55;
    var max = Math.max(0, scroller.scrollWidth - scroller.clientWidth);
    if (target < 0) target = 0;
    if (target > max) target = max;
    return target;
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function startTickAlong() {
    if (reducedMotion) return;
    nowMarker.classList.add("pulse");
    // micro tick: refresh fractional position periodically so the marker feels alive
    setInterval(updateNowMarker, 60 * 1000);
  }

  function animateDesktopToNow() {
    var target = desktopScrollTarget();
    scroller.scrollLeft = 0;
    if (reducedMotion) {
      scroller.scrollLeft = target;
      scrollHint.classList.add("hidden");
      return;
    }
    timelineEl.classList.add("zooming");
    var origin = pct(nowYear) + "% 42%";
    timelineEl.style.transformOrigin = origin;
    timelineEl.style.transform = "scale(0.92)";
    var start = 0;
    var t0 = performance.now();
    var dur = 2200;
    function frame(now) {
      var p = Math.min(1, (now - t0) / dur);
      var e = easeOutCubic(p);
      scroller.scrollLeft = start + (target - start) * e;
      var sc = 0.92 + 0.08 * e;
      timelineEl.style.transform = "scale(" + sc + ")";
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        timelineEl.style.transform = "";
        timelineEl.classList.remove("zooming");
        scrollHint.classList.add("hidden");
        startTickAlong();
      }
    }
    requestAnimationFrame(frame);
  }

  // Begin at left, then ease into today
  scroller.scrollLeft = 0;
  requestAnimationFrame(function () { requestAnimationFrame(animateDesktopToNow); });

  // Mobile year-tape

  var PX = 16; // px per year
  var tapeScroll = document.getElementById("tapeScroll");
  var tape = document.getElementById("tape");
  var tapeTicks = document.getElementById("tapeTicks");
  var tapeBands = document.getElementById("tapeBands");
  var tapePadTop = document.getElementById("tapePadTop");
  var tapePadBottom = document.getElementById("tapePadBottom");
  var tapeViewport = document.getElementById("tapeViewport");
  var roYear = document.getElementById("roYear");
  var roSaec = document.getElementById("roSaec");
  var roTurningWrap = document.getElementById("roTurningWrap");
  var roTurning = document.getElementById("roTurning");
  var roTurningYears = document.getElementById("roTurningYears");
  var roBorn = document.getElementById("roBorn");
  var roLiving = document.getElementById("roLiving");
  var roEvents = document.getElementById("roEvents");
  var cursorYear = document.getElementById("cursorYear");

  function isMobileTape() {
    return window.matchMedia("(max-width: 700px)").matches;
  }

  function lifeStage(age) {
    if (age < 0) return null;
    if (age <= 20) return "Childhood";
    if (age <= 41) return "Young adult";
    if (age <= 62) return "Midlife";
    if (age <= 83) return "Elder";
    return null;
  }

  function turningAt(year) {
    for (var i = 0; i < turnings.length; i++) {
      var t = turnings[i];
      if (year >= t.start && year < t.end) return t;
      // inclusive end for last year of turning if next doesn't claim it
      if (year === t.end) {
        var next = turnings[i + 1];
        if (!next || next.start > year) return t;
      }
    }
    // clamp to nearest
    if (year < turnings[0].start) return turnings[0];
    return turnings[turnings.length - 1];
  }

  function saeculumAt(year) {
    for (var i = 0; i < saecula.length; i++) {
      var s = saecula[i];
      if (year >= s.start && year < s.end) return s;
      if (year === s.end) {
        var next = saecula[i + 1];
        if (!next || next.start > year) return s;
      }
    }
    if (year < saecula[0].start) return saecula[0];
    return saecula[saecula.length - 1];
  }

  function buildTape() {
    if (!tapeScroll) return;
    var vh = tapeViewport.clientHeight || Math.floor(window.innerHeight * 0.45);
    var pad = Math.max(Math.floor(vh / 2), 120);
    tapePadTop.style.height = pad + "px";
    tapePadBottom.style.height = pad + "px";

    var years = YEAR_END - YEAR_START + 1;
    tapeTicks.style.height = (years * PX) + "px";
    tapeBands.style.top = pad + "px";
    tapeBands.style.height = (years * PX) + "px";
    document.querySelector(".tape-rail").style.top = pad + "px";
    document.querySelector(".tape-rail").style.height = (years * PX) + "px";

    // bands
    tapeBands.innerHTML = "";
    turnings.forEach(function (tn) {
      var b = document.createElement("div");
      b.className = "tape-band " + tn.type + (tn.projected ? " projected" : "");
      b.style.top = ((tn.start - YEAR_START) * PX) + "px";
      b.style.height = Math.max((tn.end - tn.start) * PX, 1) + "px";
      tapeBands.appendChild(b);
    });

    // ticks — build in chunks via DocumentFragment
    tapeTicks.innerHTML = "";
    var eventYears = {};
    events.forEach(function (ev) {
      eventYears[ev.year] = true;
      if (ev.end) {
        for (var y = ev.year; y <= Math.min(ev.end, ev.year + 2); y++) eventYears[y] = true;
      }
    });

    var frag = document.createDocumentFragment();
    for (var y = YEAR_START; y <= YEAR_END; y++) {
      var tick = document.createElement("div");
      var cls = "tape-tick";
      if (y % 10 === 0) cls += " y10";
      else if (y % 5 === 0) cls += " y5";
      if (eventYears[y]) cls += " has-event";
      tick.className = cls;
      tick.dataset.year = String(y);
      tick.style.top = ((y - YEAR_START) * PX) + "px";
      var html = '<div class="mark"></div>';
      if (y % 10 === 0) html += '<div class="ylab">' + y + "</div>";
      if (eventYears[y] && y % 5 !== 0) html += '<div class="evdot"></div>';
      tick.innerHTML = html;
      frag.appendChild(tick);
    }
    tapeTicks.appendChild(frag);
  }

  var lastYear = null;
  var lastDecade = null;
  var rafPending = false;
  var snapTimer = null;

  function yearFromScroll() {
    var pad = tapePadTop.offsetHeight || 0;
    var center = tapeScroll.scrollTop + tapeScroll.clientHeight / 2;
    var y = Math.round((center - pad) / PX) + YEAR_START;
    if (y < YEAR_START) y = YEAR_START;
    if (y > YEAR_END) y = YEAR_END;
    return y;
  }

  function scrollToYear(year, smooth) {
    var pad = tapePadTop.offsetHeight || 0;
    var top = pad + (year - YEAR_START) * PX - tapeScroll.clientHeight / 2;
    if (smooth && !reducedMotion && "scrollTo" in tapeScroll) {
      tapeScroll.scrollTo({ top: top, behavior: "smooth" });
    } else {
      tapeScroll.scrollTop = top;
    }
  }

  function updateReadout(year) {
    roYear.textContent = String(year);
    cursorYear.textContent = String(year);

    var s = saeculumAt(year);
    roSaec.textContent = s.name + (s.projected ? " (projected)" : "") + " · " + s.start + "–" + s.end;

    var tn = turningAt(year);
    roTurningWrap.className = "ro-row ro-turning " + tn.type;
    roTurning.textContent = tn.name + " · " + archTitle(tn.type);
    roTurningYears.textContent = tn.start + "–" + tn.end + (tn.projected ? " · projected" : "");

    // being born
    var born = [];
    generations.forEach(function (g) {
      if (year >= g.start && year <= g.end) born.push(g);
    });
    if (born.length) {
      roBorn.className = "ro-main ro-gen " + born[0].arch;
      roBorn.textContent = born.map(function (g) {
        return g.short + " (" + archTitle(g.arch) + ") · " + g.start + "–" + g.end;
      }).join(" · ");
    } else {
      roBorn.className = "ro-main";
      roBorn.textContent = "—";
    }

    // living gens
    roLiving.innerHTML = "";
    var living = [];
    generations.forEach(function (g) {
      var mid = (g.start + g.end) / 2;
      var age = Math.round(year - mid);
      var stage = lifeStage(age);
      if (!stage) return;
      living.push({ g: g, age: age, stage: stage });
    });
    living.sort(function (a, b) { return b.age - a.age; });
    if (!living.length) {
      roLiving.innerHTML = '<div class="ro-empty">None in range</div>';
    } else {
      living.forEach(function (item) {
        var row = document.createElement("div");
        row.className = "ro-living-item ro-gen " + item.g.arch;
        row.innerHTML = '<span class="name">' + esc(item.g.short) + " · " + esc(archTitle(item.g.arch)) +
          '</span><span class="meta">' + esc(item.stage) + " · ~" + item.age + "</span>";
        roLiving.appendChild(row);
      });
    }

    // nearby events ±2 years
    var near = events.filter(function (ev) {
      var end = ev.end || ev.year;
      return (ev.year <= year + 2 && end >= year - 2);
    });
    if (near.length) {
      roEvents.textContent = near.map(function (ev) {
        var span = ev.end ? (ev.year + "–" + ev.end) : String(ev.year);
        return ev.label + " (" + span + ")";
      }).join(" · ");
    } else {
      roEvents.textContent = "—";
    }
  }

  function onTapeScroll() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      if (!isMobileTape()) return;
      var year = yearFromScroll();
      if (year !== lastYear) {
        var decade = Math.floor(year / 10);
        if (lastYear !== null && decade !== lastDecade && year % 10 === 0) {
          if (!reducedMotion && typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
            try { navigator.vibrate(5); } catch (e) {}
          }
        }
        if (year % 10 === 0) lastDecade = decade;
        lastYear = year;
        updateReadout(year);
      }
      if (!reducedMotion) {
        clearTimeout(snapTimer);
        snapTimer = setTimeout(function () {
          var y = yearFromScroll();
          var pad = tapePadTop.offsetHeight || 0;
          var target = pad + (y - YEAR_START) * PX - tapeScroll.clientHeight / 2;
          if (Math.abs(tapeScroll.scrollTop - target) > 1) {
            tapeScroll.scrollTo({ top: target, behavior: "smooth" });
          }
        }, 80);
      }
    });
  }

  function initTape() {
    if (!isMobileTape()) return;
    buildTape();
    var yTarget = _nowDate.getFullYear();
    if (yTarget < YEAR_START) yTarget = YEAR_START;
    if (yTarget > YEAR_END) yTarget = YEAR_END;
    updateReadout(yTarget);
    var cursor = document.querySelector(".tape-cursor");
    requestAnimationFrame(function () {
      if (reducedMotion) {
        scrollToYear(yTarget, false);
        lastYear = yTarget;
        updateReadout(yTarget);
        return;
      }
      // start earlier in the tape, then ease to today
      scrollToYear(Math.max(YEAR_START, yTarget - 80), false);
      requestAnimationFrame(function () {
        scrollToYear(yTarget, true);
        lastYear = yTarget;
        updateReadout(yTarget);
        setTimeout(function () {
          if (cursor) cursor.classList.add("pulse");
        }, 900);
      });
    });
  }

  if (tapeScroll) {
    tapeScroll.addEventListener("scroll", onTapeScroll, { passive: true });
    window.addEventListener("resize", function () {
      if (!isMobileTape()) return;
      var y = lastYear || Math.round(nowYear);
      buildTape();
      scrollToYear(y, false);
      updateReadout(y);
    });
    // Only build when mobile (or always build — cheap enough; hide via CSS)
    if (isMobileTape()) initTape();
    else {
      // Prebuild lightly when switching later
      window.addEventListener("orientationchange", function () { setTimeout(initTape, 200); });
    }
  }


  function eventKey(ev) {
    return String(ev.label || "").toLowerCase().replace(/\s+/g, " ").trim() + "|" + String(ev.year);
  }

  function mergeLiveEvents(extra) {
    if (!extra || !extra.length) return 0;
    var seen = {};
    events.forEach(function (ev) { seen[eventKey(ev)] = true; });
    var added = 0;
    extra.forEach(function (raw) {
      if (!raw || raw.year == null || !raw.label) return;
      var year = Number(raw.year);
      if (!isFinite(year)) return;
      year = Math.round(year);
      if (year < YEAR_START || year > Math.ceil(nowYear) + 1) return;
      if (year > YEAR_END) return;
      var ev = {
        label: String(raw.label).slice(0, 40),
        year: year,
        detail: String(raw.detail || (raw.label + " (" + year + ", Grokipedia live).")),
        source: raw.source || ("https://grokipedia.com/page/" + encodeURIComponent(raw.slug || raw.label))
      };
      if (raw.end != null && isFinite(Number(raw.end))) ev.end = Math.round(Number(raw.end));
      var k = eventKey(ev);
      if (seen[k]) return;
      seen[k] = true;
      events.push(ev);
      added++;
    });
    if (added) {
      events.sort(function (a, b) { return a.year - b.year; });
      renderEvents(events, false);
      if (isMobileTape() && tapeScroll) {
        var y = lastYear || Math.round(nowYear);
        buildTape();
        scrollToYear(y, false);
        updateReadout(y);
      }
    }
    return added;
  }

  function fetchLiveEvents() {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { try { if (ctrl) ctrl.abort(); } catch (e) {} }, 3000);
    var opts = { headers: { "Accept": "application/json" } };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch("/.netlify/functions/events?since=" + encodeURIComponent(String(Math.floor(nowYear))), opts)
      .then(function (r) {
        if (!r.ok) throw new Error("live " + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        var list = (data && (data.events || data)) || [];
        if (!Array.isArray(list)) list = [];
        mergeLiveEvents(list);
        return list;
      })
      .catch(function () {
        clearTimeout(timer);
        // silent fallback to baked-in baseline
        return null;
      });
  }

  fetchLiveEvents();

  // Expose for overlap test harness
  window.__FT = {
    YEAR_START: YEAR_START, YEAR_END: YEAR_END, events: events, generations: generations,
    scrollToYear: scrollToYear, yearFromScroll: yearFromScroll, updateReadout: updateReadout,
    nowYear: nowYear, mergeLiveEvents: mergeLiveEvents, fetchLiveEvents: fetchLiveEvents
  };
})();
</script>
</body>
</html>
